<!DOCTYPE html>

<body>
    <header class="navbar">
        <div class="navbar__identity">
            <img src="./assets/img/ball_world_cup_26.png" alt="Bola da Copa do Mundo de 2026 - Trionda." class="identity__image">

                        <h3 class="pais__nome">México</h3>
                        <span class="pais__pontuacao">9</span>
                        <span class="pais__jogos">

                    <div class="paises__posicao">

                        <span class="pais__pontuacao">4</span>
                        <span class="pais__jogos">
                            <span class="jogos__derrota jogos__item"></span>
                            <span class="jogos__empate jogos__item"></span>

                    <div class="paises__posicao">

                            <span class="jogos__derrota jogos__item"></span>

                        </span>
                    </div>
                    <div class="paises__posicao">
                        <span class="pais__posicao">4</span>
                        <img src="https://api.fifa.com/api/v3/picture/flags-sq-1/CZE" alt="" class="pais__flag">
                        <h3 class="pais__nome">Tchéquia</h3>
                        <span class="pais__pontuacao">1</span>
                        <span class="pais__jogos">
                            <span class="jogos__derrota jogos__item"></span>
                            <span class="jogos__empate jogos__item"></span>
                            <span class="jogos__derrota jogos__item"></span>

    <footer class="rodape">
